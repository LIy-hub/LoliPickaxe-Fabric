plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    mods { liymod { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version
    exclude 'assets/liymod/lolicards/**'

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

// Geometry checks run without opening Minecraft or adding a test framework dependency.
sourceSets {
	guiTest {
		compileClasspath += sourceSets.client.output + sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.main.runtimeClasspath
	}
}

tasks.register('verifyGuiLayout', JavaExec) {
	dependsOn tasks.named('guiTestClasses')
	classpath = sourceSets.guiTest.runtimeClasspath
	mainClass = 'com.liymod.client.gui.EditorLayoutRegressionTest'
}

tasks.register('verifyStoragePages', JavaExec) {
	dependsOn tasks.named('guiTestClasses')
	classpath = sourceSets.guiTest.runtimeClasspath
	mainClass = 'com.liymod.storage.StoragePagesRegressionTest'
	workingDir = layout.buildDirectory.dir('storage-test-run').get().asFile
	doFirst { workingDir.mkdirs() }
}

tasks.register('verifyRecipeCodecs', JavaExec) {
    dependsOn tasks.named('guiTestClasses')
    classpath = sourceSets.guiTest.runtimeClasspath
    mainClass = 'com.liymod.recipe.RecipeCodecRegressionTest'
    workingDir = layout.buildDirectory.dir('recipe-test-run').get().asFile
    doFirst { workingDir.mkdirs() }
}

tasks.named('check') {
    dependsOn tasks.named('verifyRecipeCodecs')
	dependsOn tasks.named('verifyGuiLayout')
	dependsOn tasks.named('verifyStoragePages')
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	from("CREDITS.md") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.register('verifyFluidMining', JavaExec) {
 dependsOn tasks.named('guiTestClasses')
 classpath = sourceSets.guiTest.runtimeClasspath
 mainClass = 'com.liymod.item.LoliFluidMiningRegressionTest'
}
tasks.named('check') { dependsOn tasks.named('verifyFluidMining') }

tasks.register('verifyMiningInteractions', JavaExec) {
 dependsOn tasks.named('guiTestClasses')
 classpath = sourceSets.guiTest.runtimeClasspath
 mainClass = 'com.liymod.item.MiningInteractionRegressionTest'
}
tasks.named('check') { dependsOn tasks.named('verifyMiningInteractions') }

tasks.register('verifyKillSummaries', JavaExec) {
 dependsOn tasks.named('guiTestClasses')
 classpath = sourceSets.guiTest.runtimeClasspath
 mainClass = 'com.liymod.combat.LoliKillSummaryRegressionTest'
}
tasks.named('check') { dependsOn tasks.named('verifyKillSummaries') }

tasks.register('verifyDivineChat', JavaExec) {
 dependsOn tasks.named('guiTestClasses')
 classpath = sourceSets.guiTest.runtimeClasspath
 mainClass = 'com.liymod.client.gui.LoliChatRainbowRegressionTest'
}
tasks.named('check') { dependsOn tasks.named('verifyDivineChat') }
