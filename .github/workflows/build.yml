# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: verify release contract
        shell: pwsh
        run: ./scripts/verify-release.ps1 -ExpectedMinecraftVersion 26.3 -ExpectedJavaRelease 25
      - name: verify full content contract
        shell: pwsh
        run: ./scripts/verify-full-port.ps1
      - name: capture test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test reports
          path: |
            build/reports/
            build/test-results/
      - name: record runtime JAR identity
        run: python3 scripts/write-runtime-manifest.py
      - name: capture runtime JAR identity
        uses: actions/upload-artifact@v4
        with:
          name: Runtime identity
          path: build/runtime-manifest.json
          if-no-files-found: error
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
