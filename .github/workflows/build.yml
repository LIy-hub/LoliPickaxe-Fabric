name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: Native Forge build and regression checks
        run: ./gradlew --no-daemon --max-workers=1 --no-parallel check build
      - name: Verify Forge package contract
        shell: pwsh
        run: ./scripts/verify-full-port.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Forge-1.20.1
          path: build/libs/
